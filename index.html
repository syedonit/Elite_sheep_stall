<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasonal Premium Sheep Stall</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        h1 { text-align: center; color: #1a6b3c; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .card h3 { color: #1a6b3c; margin-bottom: 5px; }
        .price { font-size: 1.3rem; font-weight: bold; color: #1a6b3c; margin: 10px 0; }
        .status { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .avail { background: #27ae60; color: white; }
        .limited { background: #f39c12; color: white; }
        .sold { background: #e74c3c; color: white; }
        .badge { background: #f0f0f0; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-right: 5px; display: inline-block; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; max-width: 500px; width: 90%; border-radius: 16px; padding: 20px; max-height: 80vh; overflow-y: auto; }
        .close { float: right; font-size: 24px; cursor: pointer; }
        .loading { text-align: center; padding: 40px; }
        button { background: #25d366; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; margin-top: 10px; }
        .filters { text-align: center; margin: 20px 0; }
        select { padding: 8px 15px; margin: 0 5px; border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<h1>🐑 Seasonal Premium Sheep Stall</h1>
<p style="text-align:center">Eid al-Adha Mubarak 🌙</p>

<div class="filters">
    <select id="priceFilter" onchange="applyFilters()">
        <option value="all">💰 All Prices</option>
        <option value="0-15000">Under ₹15,000</option>
        <option value="15000-30000">₹15,000–₹30,000</option>
        <option value="30000-75000">₹30,000–₹75,000</option>
        <option value="75000-999999">₹75,000+</option>
    </select>
</div>

<div id="animalsGrid" class="grid">
    <div class="loading">🔄 Loading animals...</div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle"></h2>
        <p id="modalType"></p>
        <p id="modalPrice"></p>
        <p id="modalDesc"></p>
        <p id="modalDetails"></p>
        <button id="modalWaBtn">💬 Inquire on WhatsApp</button>
    </div>
</div>

<script>
// Firebase configuration
const firebaseConfig = {
    apiKey: "AIzaSyACduHPIrZv_rp01vh_EqnfazRk0oFRnJs",
    authDomain: "seasonal-sheep-stall.firebaseapp.com",
    projectId: "seasonal-sheep-stall",
    storageBucket: "seasonal-sheep-stall.firebasestorage.app",
    messagingSenderId: "923546588237",
    appId: "1:923546588237:web:97779cbda902b4aa8b3804"
};

let allAnimals = [];
let currentFilter = "all";

// Load Firebase SDK and fetch data
async function init() {
    console.log("🟢 Starting...");
    
    // Load Firebase
    await loadFirebase();
    
    // Initialize
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
        console.log("✅ Firebase initialized");
    }
    
    const db = firebase.firestore();
    
    try {
        const snapshot = await db.collection("listings").get();
        console.log(`📊 Got ${snapshot.size} animals from Firestore`);
        
        allAnimals = [];
        snapshot.forEach(doc => {
            const data = doc.data();
            allAnimals.push({
                id: doc.id,
                name: data.breed,
                type: data.type || "Sheep",
                price: data.price || 10000,
                weight: data.weight || "20-40 kg",
                age: data.age || "1-2 Years",
                origin: data.origin || "Premium",
                availability: data.availability || "Available",
                description: data.description || "Premium Qurbani animal"
            });
        });
        
        renderAnimals();
        
    } catch (error) {
        console.error("❌ Firestore error:", error);
        document.getElementById("animalsGrid").innerHTML = `<div style="text-align:center; grid-column:1/-1;">❌ Error loading data. ${error.message}</div>`;
    }
}

function loadFirebase() {
    return new Promise((resolve) => {
        if (typeof firebase !== 'undefined') {
            resolve();
            return;
        }
        const script = document.createElement('script');
        script.src = 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js';
        script.onload = () => {
            const fsScript = document.createElement('script');
            fsScript.src = 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js';
            fsScript.onload = resolve;
            document.head.appendChild(fsScript);
        };
        document.head.appendChild(script);
    });
}

function applyFilters() {
    currentFilter = document.getElementById('priceFilter').value;
    renderAnimals();
}

function renderAnimals() {
    let filtered = [...allAnimals];
    
    if (currentFilter !== "all") {
        const [min, max] = currentFilter.split('-').map(Number);
        filtered = filtered.filter(a => a.price >= min && a.price <= max);
    }
    
    const grid = document.getElementById("animalsGrid");
    
    if (filtered.length === 0) {
        grid.innerHTML = '<div style="text-align:center; grid-column:1/-1;">😔 No animals found</div>';
        return;
    }
    
    grid.innerHTML = filtered.map(animal => {
        let statusClass = "avail";
        let statusText = "✓ Available";
        if (animal.availability === "Limited") {
            statusClass = "limited";
            statusText = "⚡ Limited";
        } else if (animal.availability === "Sold") {
            statusClass = "sold";
            statusText = "✗ Sold";
        }
        
        return `
            <div class="card" onclick="showDetail('${animal.id}')">
                <h3>${animal.name}</h3>
                <p>${animal.type} · ${animal.origin}</p>
                <div class="price">₹${animal.price.toLocaleString()}</div>
                <div><span class="badge">⚖️ ${animal.weight}</span><span class="badge">📅 ${animal.age}</span><span class="badge">💉 Vaccinated</span></div>
                <div><span class="status ${statusClass}">${statusText}</span></div>
            </div>
        `;
    }).join('');
}

function showDetail(id) {
    const animal = allAnimals.find(a => a.id === id);
    if (!animal) return;
    
    document.getElementById("modalTitle").innerText = animal.name;
    document.getElementById("modalType").innerHTML = `${animal.type} · ${animal.origin}`;
    document.getElementById("modalPrice").innerHTML = `<strong>💰 Price:</strong> ₹${animal.price.toLocaleString()}`;
    document.getElementById("modalDesc").innerHTML = animal.description;
    document.getElementById("modalDetails").innerHTML = `
        <strong>⚖️ Weight:</strong> ${animal.weight}<br>
        <strong>📅 Age:</strong> ${animal.age}<br>
        <strong>📦 Status:</strong> ${animal.availability}<br>
        <strong>💉 Health:</strong> Vaccinated & vet-checked
    `;
    
    const waMsg = encodeURIComponent(`Assalamualaikum! I'm interested in *${animal.name}* for Qurbani 🐑. Please share details.`);
    document.getElementById("modalWaBtn").onclick = () => {
        window.open(`https://wa.me/918105122693?text=${waMsg}`, '_blank');
    };
    
    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

// Start
init();
</script>
</body>
</html>
